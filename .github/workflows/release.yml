name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          # go.mod declares the minimum version, not the release toolchain.
          # Older Go linkers omit LC_UUID required by current macOS runners.
          go-version: stable
          check-latest: true
          cache: false
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Test installer
        run: bash scripts/test-install.sh
      - name: Run release-style binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/rmate-smoke" .
          "$RUNNER_TEMP/rmate-smoke" --version

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Build archives and checksums
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            flags=()
            version="${RELEASE_TAG#v}"
            if [[ "${version%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
